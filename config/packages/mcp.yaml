# config/packages/mcp.yaml
mcp:
    app: 'itop-mcp' # Application name to be exposed to clients
    version: '1.0.0' # Application version to be exposed to clients
    description: 'iTop MCP server' # Application description to be exposed to clients
    icons:
        - src: 'https://example.com/icon.png' # Application icon URL
          mime_type: 'image/png' # MIME type of the icon
          sizes: ['64x64'] # Sizes of the icon
    website_url: 'http://demo.combodo.com/itop-mcp' # Application website URL
    pagination_limit: 50 # Maximum number of items returned per list request (default: 50)
    instructions: | # Instructions describing server purpose and usage context (for LLMs)
        This server provides capabilities to manipulate information (objects) managed by iTop.
        iTop is an IT Service Management (ITSM) software (more information at https://www.itophub.io/wiki/)

        iTop manages different type of Tickets (User Requests, Incident, Changes), Services and Contracts information
        as well as a full CMDB (Organizations, Persons, Teams, PCs, Servers, Clusters, Virtual Machines, etc...)
        
        IMPORTANT:
        The schema of iTop can be customized, therefore each instance of iTop as a unique schema.
        DO NOT assume that the schema follows the documentation on the internet. Use the tools "get-all-classes" and "get-class-schema"
        to obtain information about the schema of this particular iTop instance.

    client_transports:
        stdio: false # Enable STDIO via command
        http: true # Enable HTTP transport via controller

    # HTTP transport configuration (optional)
    http:
        path: /_mcp # HTTP endpoint path (default: /_mcp)
        session:
            store: file # Session store type: 'file' or 'memory' (default: file)
            directory: '%kernel.cache_dir%/mcp-sessions' # Directory for file store (default: cache_dir/mcp-sessions)
            ttl: 3600 # Session TTL in seconds (default: 3600)
